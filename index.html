<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>絕對音感・卡點挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sk-ink: #1d1a4a;
    --sk-dim: #8580b0;
    --sk-soft: #b8b3ff;
    --sk-pri: #8f8df7;
    --sk-acc: #ff5fa8;
    --sk-card: #fff;
    --paper: #fbfaff;
    --line: #5a4fd8;
    --sh: 6px 7px 0 var(--sk-soft);
    --bw: 3.2px;
    --r: 15px;
    --num: "Dela Gothic One", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--sk-ink);
    background:
      radial-gradient(circle at 0 0, rgba(184,179,255,.55) 1.4px, transparent 1.6px) 0 0 / 14px 14px,
      var(--paper);
    font: 500 16px/1.5 "Noto Sans TC", system-ui, sans-serif;
    overflow-x: hidden;
  }
  /* 角落的速度線 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-conic-gradient(from 0deg at 50% 50%, transparent 0 3.2deg, rgba(143,141,247,.07) 3.2deg 4deg);
    mask: radial-gradient(circle at 50% 50%, transparent 38%, #000 80%);
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent 38%, #000 80%);
  }
  main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }

  .logo { text-align: center; margin: 6px 0 26px; }
  .logo .kana { font: 400 14px var(--num); letter-spacing: .3em; color: var(--sk-acc); }
  .logo h1 {
    margin: 2px 0 0; font: 900 clamp(34px, 7vw, 60px)/1.05 "Noto Sans TC", sans-serif; letter-spacing: .04em;
    transform: skewX(-8deg); color: var(--sk-card);
    -webkit-text-stroke: 2px var(--sk-ink); paint-order: stroke fill;
    text-shadow: 4px 5px 0 var(--sk-pri), 7px 9px 0 var(--sk-ink);
  }
  .logo .sub { margin-top: 10px; font-weight: 700; color: var(--sk-dim); }

  .panel {
    position: relative; background: var(--sk-card); border: var(--bw) solid var(--sk-ink);
    border-radius: var(--r); box-shadow: var(--sh); padding: 26px;
  }
  .tag {
    position: absolute; top: -16px; left: 20px; padding: 3px 14px; background: var(--sk-acc); color: #fff;
    border: var(--bw) solid var(--sk-ink); border-radius: 999px; font: 400 13px var(--num); letter-spacing: .12em; transform: rotate(-3deg);
  }
  .screen[hidden], .overlay[hidden] { display: none !important; }

  /* ── 開始 ── */
  #start .panel { max-width: 480px; margin: 0 auto; text-align: center; padding-top: 34px; }
  .rules { text-align: left; margin: 0 0 22px; padding: 14px 16px; border: 2px dashed var(--sk-soft); border-radius: 12px; font-size: 15px; }
  .rules b { color: var(--sk-acc); }
  .rules ol { margin: 6px 0 0; padding-left: 20px; }
  label.name { display: block; font-weight: 900; margin-bottom: 8px; }
  input#name {
    width: 100%; padding: 12px 16px; font: 700 20px "Noto Sans TC", sans-serif; text-align: center; color: var(--sk-ink);
    border: var(--bw) solid var(--sk-ink); border-radius: 12px; background: var(--paper); outline: none;
  }
  input#name:focus { box-shadow: 0 0 0 4px rgba(255,95,168,.35); }
  .row { display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 24px; }
  .link { background: none; border: 0; padding: 4px; font: 700 15px "Noto Sans TC", sans-serif; color: var(--line); text-decoration: underline wavy var(--sk-soft); text-underline-offset: 5px; cursor: pointer; }
  .hint { min-height: 1.5em; margin-top: 10px; color: var(--sk-acc); font-weight: 700; font-size: 14px; }

  /* ── 遊戲 ── */
  /* 由上到下：秒數 → 影片 → 按鈕；影片寬度跟著視窗高度縮，整個畫面不用捲動 */
  #play .stage {
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    width: min(100%, 780px, max(340px, calc((100vh - 470px) * 16 / 9 + 20px))); margin: 0 auto;
  }
  .vid { width: 100%; padding: 10px; transform: rotate(-.6deg); }
  .vid video { display: block; width: 100%; aspect-ratio: 16 / 9; background: var(--sk-ink); border-radius: 8px; }
  .player { position: absolute; top: -16px; right: 20px; left: auto; background: var(--sk-pri); transform: rotate(2deg); font: 900 14px "Noto Sans TC", sans-serif; letter-spacing: .06em; }
  .clock { display: inline-flex; align-items: baseline; gap: 14px; padding: 8px 26px 6px; transform: rotate(.8deg); }
  .clock .lbl { font: 400 13px var(--num); letter-spacing: .3em; color: var(--sk-dim); }
  .clock .t { font: 400 clamp(44px, 6vw, 60px)/1 var(--num); font-variant-numeric: tabular-nums; letter-spacing: .02em; white-space: nowrap; }
  .clock .t small { font-size: .32em; margin-left: 6px; color: var(--sk-dim); }
  .press-box { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 6px; }
  .press-box sakuga-button::part(button) { font-size: 26px; padding: 20px 48px; }
  .press-box sakuga-button.locked { pointer-events: none; }
  .stamp { min-height: 1.6em; font-weight: 900; color: var(--sk-acc); }
  .stamp .n { font-family: var(--num); font-weight: 400; }

  /* ── 結算 ── */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
    background: rgba(29,26,74,.55); backdrop-filter: blur(3px);
  }
  .overlay .panel { width: min(520px, 100%); text-align: center; padding-top: 36px; animation: slam .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes slam { from { transform: scale(1.6) rotate(6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .verdict {
    margin: 0; font: 900 clamp(34px, 8vw, 50px)/1.1 "Noto Sans TC", sans-serif; transform: skewX(-8deg);
    color: var(--sk-card); -webkit-text-stroke: 2px var(--sk-ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--sk-acc);
  }
  .who { margin-top: 4px; color: var(--sk-dim); font-weight: 700; }
  .stars-wrap { margin: 18px 0 6px; display: flex; justify-content: center; }
  .stars-wrap sakuga-rating { pointer-events: none; transform: scale(1.35); margin: 10px 0; }
  .score-n { font: 400 22px var(--num); }
  .score-n small { font-family: "Noto Sans TC"; font-weight: 700; font-size: 14px; color: var(--sk-dim); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 4px; }
  .fact { padding: 10px 6px; border: 2px solid var(--sk-ink); border-radius: 12px; background: var(--paper); }
  .fact .k { font-size: 13px; color: var(--sk-dim); font-weight: 700; }
  .fact .v { font: 400 24px/1.2 var(--num); }
  .fact.hl { background: #fff0f7; border-color: var(--sk-acc); }
  .fact.hl .v { color: var(--sk-acc); }

  /* ── 排行榜 ── */
  #board .panel { padding-top: 34px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  th { font-size: 13px; color: var(--sk-dim); text-align: left; padding: 0 12px; font-weight: 700; }
  td { padding: 10px 12px; background: var(--paper); border-top: 2px solid var(--sk-ink); border-bottom: 2px solid var(--sk-ink); }
  td:first-child { border-left: 2px solid var(--sk-ink); border-radius: 12px 0 0 12px; }
  td:last-child { border-right: 2px solid var(--sk-ink); border-radius: 0 12px 12px 0; }
  td.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
  td.nm { font-weight: 900; }
  tr.me td { background: #fff0f7; border-color: var(--sk-acc); }
  .rk { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--sk-ink); font: 400 16px var(--num); background: #fff; }
  tr:nth-child(1) .rk { background: var(--sk-acc); color: #fff; }
  tr:nth-child(2) .rk { background: var(--sk-pri); color: #fff; }
  tr:nth-child(3) .rk { background: var(--sk-soft); }
  .mini { display: inline-flex; gap: 1px; vertical-align: middle; }
  .mini svg { width: 18px; height: 18px; stroke: var(--sk-ink); stroke-width: 2.3; stroke-linejoin: round; }
  .empty { text-align: center; padding: 30px 0; color: var(--sk-dim); font-weight: 700; }
  .miss { color: var(--sk-dim); font-family: "Noto Sans TC"; font-weight: 700; }

  /* ── 最終結算（頒獎台）── */
  .finale {
    position: fixed; inset: 0; z-index: 30; overflow: hidden auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 28px 16px 36px; color: #fff;
    background: radial-gradient(circle at 50% 55%, #4a43b8 0, #2b2770 38%, var(--sk-ink) 75%);
  }
  .finale[hidden] { display: none !important; }
  .finale::before {   /* 集中線 */
    content: ""; position: fixed; left: 50%; top: 55%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, transparent 0 2.4deg, rgba(184,179,255,.22) 2.4deg 3deg, transparent 3deg 5.2deg, rgba(255,255,255,.12) 5.2deg 5.5deg);
    mask: radial-gradient(circle, transparent 9%, #000 26%); -webkit-mask: radial-gradient(circle, transparent 9%, #000 26%);
    animation: spin 60s linear infinite;
  }
  .finale::after {    /* 網點 */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(255,95,168,.28) 1.3px, transparent 1.6px) 0 0 / 12px 12px;
    mask: linear-gradient(to top, #000, transparent 45%); -webkit-mask: linear-gradient(to top, #000, transparent 45%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .finale > * { position: relative; z-index: 1; }
  .f-head { text-align: center; animation: slam .5s .1s cubic-bezier(.2,1.6,.4,1) both; }
  .f-kana { font: 400 15px var(--num); letter-spacing: .4em; color: var(--sk-acc); }
  .f-title {
    margin: 0; font: 900 clamp(44px, 9vw, 84px)/1.05 "Noto Sans TC", sans-serif; letter-spacing: .1em; transform: skewX(-10deg);
    color: #fff; -webkit-text-stroke: 3px var(--sk-ink); paint-order: stroke fill;
    text-shadow: 5px 6px 0 var(--sk-acc), 9px 11px 0 var(--sk-ink);
  }

  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 230px)); align-items: end; gap: 14px; margin-top: 30px; width: min(100%, 740px); justify-content: center; }
  .place { display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(80px) scale(.7); }
  .place.in { animation: rise .6s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(80px) scale(.7); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  .f-card {
    position: relative; width: 100%; padding: 14px 10px 12px; margin-bottom: 12px; text-align: center; color: var(--sk-ink);
    background: #fff; border: var(--bw) solid var(--sk-ink); border-radius: var(--r); box-shadow: 6px 7px 0 var(--sk-pri);
  }
  .p2 .f-card { transform: rotate(-2deg); }
  .p3 .f-card { transform: rotate(2deg); }
  .f-label { position: absolute; top: -17px; left: 50%; transform: translateX(-50%) rotate(-4deg); padding: 2px 14px; border: var(--bw) solid var(--sk-ink); border-radius: 999px; background: var(--sk-pri); color: #fff; font: 400 15px var(--num); letter-spacing: .08em; white-space: nowrap; }
  .p1 .f-label { background: var(--sk-acc); font-size: 18px; }
  .p3 .f-label { background: var(--sk-soft); color: var(--sk-ink); }
  .f-name { margin-top: 6px; font: 900 clamp(18px, 3.4vw, 26px)/1.2 "Noto Sans TC", sans-serif; overflow-wrap: anywhere; }
  .p1 .f-name { font-size: clamp(22px, 4.4vw, 34px); color: var(--sk-acc); }
  .f-stars { display: inline-flex; gap: 2px; margin: 6px 0 2px; }
  .f-stars svg { width: clamp(14px, 2.6vw, 20px); height: clamp(14px, 2.6vw, 20px); stroke: var(--sk-ink); stroke-width: 2.3; stroke-linejoin: round; }
  .f-diff { font-size: 13px; font-weight: 700; color: var(--sk-dim); }
  .block {
    width: 100%; display: grid; place-items: start center; padding-top: 10px;
    border: var(--bw) solid var(--sk-ink); border-bottom: 0; border-radius: 14px 14px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 40%), var(--sk-pri);
  }
  .p1 .block { height: 170px; background-color: var(--sk-acc); }
  .p2 .block { height: 120px; }
  .p3 .block { height: 86px; background-color: var(--sk-soft); }
  /* Dela Gothic 的字形有重疊輪廓，用 text-stroke 會出現白點，改用多層陰影描邊 */
  .block .f-rk {
    font: 400 clamp(46px, 8vw, 72px)/1 var(--num); color: #fff;
    text-shadow: -2px -2px 0 var(--sk-ink), 2px -2px 0 var(--sk-ink), -2px 2px 0 var(--sk-ink), 2px 2px 0 var(--sk-ink),
                 0 -3px 0 var(--sk-ink), 0 3px 0 var(--sk-ink), -3px 0 0 var(--sk-ink), 3px 0 0 var(--sk-ink), 5px 6px 0 var(--sk-ink);
  }
  .p1 { position: relative; }
  .p1::before {   /* 第一名背後的光芒 */
    content: ""; position: absolute; left: 50%; top: 30%; width: 420px; height: 420px; margin: -210px 0 0 -210px; z-index: -1; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, rgba(255,216,77,.5) 0 6deg, transparent 6deg 18deg);
    mask: radial-gradient(circle, #000 0, #000 22%, transparent 62%); -webkit-mask: radial-gradient(circle, #000 0, #000 22%, transparent 62%);
    animation: spin 14s linear infinite; opacity: 0; transition: opacity .6s .2s;
  }
  .p1.in::before { opacity: 1; }
  .crown { width: 74px; margin-bottom: -6px; fill: #ffd84d; stroke: var(--sk-ink); stroke-width: 3.2; stroke-linejoin: round; transform: rotate(-8deg); }
  .p1.in .crown { animation: crown .7s .25s cubic-bezier(.2,1.8,.4,1) both; }
  @keyframes crown { from { transform: translateY(-120px) rotate(-30deg) scale(.4); opacity: 0; } to { transform: rotate(-8deg); opacity: 1; } }
  .vacant .f-card { opacity: .55; box-shadow: none; }
  .vacant .block { filter: grayscale(.7) brightness(.7); }
  .f-empty { grid-column: 1 / -1; text-align: center; font-weight: 900; font-size: 20px; padding: 40px 0; }

  .f-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 26px; opacity: 0; transform: translateY(20px); transition: .4s; pointer-events: none; }
  .finale.done .f-actions { opacity: 1; transform: none; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    .finale::before, .p1::before { animation: none; }
  }

  @media (max-width: 640px) {
    .panel { padding: 22px 16px; }
    .facts .v { font-size: 19px; }
    th:nth-child(3), td:nth-child(3) { display: none; }
    td, th { padding-left: 8px; padding-right: 8px; }
    .podium { gap: 8px; }
    .p1 .block { height: 130px; } .p2 .block { height: 92px; } .p3 .block { height: 66px; }
    .p1::before { width: 300px; height: 300px; margin: -150px 0 0 -150px; }
    .crown { width: 54px; }
    .f-label { font-size: 12px !important; padding: 1px 9px; }
  }
</style>
</head>
<body>
<main>
  <header class="logo">
    <div class="kana">ゼッタイオンカン</div>
    <h1>絕對音感・卡點挑戰</h1>
    <div class="sub">鼓聲落下的那一瞬間，你抓得到嗎？</div>
  </header>

  <!-- 開始 -->
  <section id="start" class="screen">
    <div class="panel">
      <span class="tag">ENTRY</span>
      <div class="rules">
        <b>玩法</b>
        <ol>
          <li>影片開始後，仔細聽 <b>鼓聲進來</b> 的瞬間</li>
          <li>覺得就是那一刻，按下按鈕（或按 <b>空白鍵</b>），只有一次機會</li>
          <li>離卡點越近星星越多，每差 0.3 秒扣半顆</li>
        </ol>
      </div>
      <label class="name" for="name">挑戰者名字</label>
      <input id="name" maxlength="12" autocomplete="off" placeholder="輸入你的名字">
      <div class="hint" id="startHint"></div>
      <div class="row">
        <sakuga-button id="go">開始挑戰！</sakuga-button>
      </div>
      <div class="row" style="margin-top:14px"><button class="link" id="toBoard">看排行榜</button></div>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="play" class="screen" hidden>
    <div class="stage">
      <div class="panel clock">
        <span class="lbl">TIME</span>
        <span class="t"><span id="clock">0.00</span><small>秒</small></span>
      </div>
      <div class="panel vid">
        <span class="tag player" id="who">PLAYER</span>
        <video id="video" src="Whitney%20Houston%20-%20I%20Will%20Always%20Love%20You.mp4" preload="auto" playsinline></video>
      </div>
      <div class="press-box">
        <sakuga-button id="press">就是現在！</sakuga-button>
        <div class="stamp" id="stamp">我預判你的預判！</div>
      </div>
    </div>
  </section>

  <!-- 排行榜 -->
  <section id="board" class="screen" hidden>
    <div class="panel">
      <span class="tag">RANKING</span>
      <div id="boardBody"></div>
      <div class="row">
        <sakuga-button id="next">下一位挑戰者</sakuga-button>
        <sakuga-button id="final" variant="secondary">結算</sakuga-button>
      </div>
    </div>
  </section>
</main>

<!-- 結算 -->
<div class="overlay" id="result" hidden>
  <div class="panel">
    <span class="tag">RESULT</span>
    <h2 class="verdict" id="verdict">神之耳！</h2>
    <div class="who" id="rWho"></div>
    <div class="stars-wrap"><sakuga-rating id="rating" label="得分"></sakuga-rating></div>
    <div class="score-n"><span id="rStars">5</span> <small>顆星</small></div>
    <div class="facts">
      <div class="fact"><div class="k">你按下</div><div class="v" id="rPress">-</div></div>
      <div class="fact"><div class="k">卡點</div><div class="v" id="rHit">-</div></div>
      <div class="fact hl"><div class="k">差距</div><div class="v" id="rDiff">-</div></div>
    </div>
    <div class="row">
      <sakuga-button id="toRank">看排行榜</sakuga-button>
    </div>
  </div>
</div>

<!-- 最終結算：前三名 -->
<div class="finale" id="finale" hidden>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="f-half" x1="0" x2="1"><stop offset=".5" stop-color="#8f8df7"/><stop offset=".5" stop-color="#fff"/></linearGradient></defs></svg>
  <div class="f-head">
    <div class="f-kana">けっかはっぴょう</div>
    <h2 class="f-title">最終結算</h2>
  </div>
  <div class="podium" id="podium"></div>
  <div class="f-actions">
    <sakuga-button id="finBack">回排行榜</sakuga-button>
    <sakuga-button id="finReset" variant="secondary">新的一場</sakuga-button>
  </div>
</div>

<script src="vendor/button.js"></script>
<script src="vendor/rating.js"></script>
<script src="js/score.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/finale-sfx.js"></script>
<script src="js/finale.js"></script>
<script src="js/game.js"></script>
</body>
</html>
